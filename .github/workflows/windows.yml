name: Windows community build

on:
  pull_request:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check the public source list
        run: |
          python -c "from pathlib import Path; import subprocess; a=Path('SOURCE_ALLOWLIST.txt').read_text().splitlines(); files=subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0))[:-1]; assert sorted(a)==sorted(files),set(a)^set(files)"
      - name: Install desktop and test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pytest==9.2.0 playwright==1.62.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv\Scripts).Path >> $env:GITHUB_PATH
      - name: Install and verify Studio's pinned media tools
        run: |
          $bin = python -c "import os; from pathlib import Path; from h3studio.community import install; os.environ['PATH']=str(Path(os.environ['SystemRoot'])/'System32'); print(Path(install(Path(os.environ['RUNNER_TEMP'])/'h3-media')['media']['ffmpeg']).parent)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin >> $env:GITHUB_PATH
      - name: Run regression suite
        env:
          H3_NATIVE_UI_TESTS: '1'
          H3_CUT_RECEIPT: dist/native-edit-room
        run: python -m pytest -q --junitxml=dist/source-tests.xml
      - name: Build and compare portable ZIP with source
        if: github.event_name != 'pull_request'
        run: python scripts/build_portable.py
      - name: Save built package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-portable
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Identify the hosted WebView2 runtime
        if: github.event_name != 'pull_request'
        run: |
          $base = [Environment]::GetFolderPath('ProgramFilesX86')
          $runtime = Join-Path $base 'Microsoft/EdgeWebView/Application/*/msedgewebview2.exe'
          Get-Item -Path $runtime -ErrorAction Stop | ForEach-Object { $_.VersionInfo.ProductVersion }
          Get-Process -Id $PID | Select-Object ProcessName,SessionId
          Get-Service Audiosrv,AudioEndpointBuilder | Select-Object Name,Status
          Get-ChildItem 'HKLM:/SOFTWARE/Microsoft/Speech/Voices/Tokens' -ErrorAction SilentlyContinue | Select-Object PSChildName
      - name: Launch extracted Studio and verify Film, Game and editing
        if: github.event_name != 'pull_request'
        run: |
          $archive = Get-Item dist/*.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/extracted
          python scripts/verify_community.py --exe "dist/extracted/H3 Creative Studio/H3 Creative Studio.exe" --edit-workflow --evidence dist/community
      - name: Verify narration, assistants, editable examples and delivery
        if: github.event_name != 'pull_request'
        run: python scripts/verify_workshops.py --record --exe "dist/extracted/H3 Creative Studio/H3 Creative Studio.exe" --evidence dist/workshops
      - name: Build and decode the two product tours
        if: github.event_name != 'pull_request'
        run: |
          $captures = (Get-ChildItem -Directory dist/workshops/Workshops-*).FullName
          python examples/tour/build.py --captures $captures --output dist/showcase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/tour/verify.py --output dist/showcase
      - name: Save verified community films
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-tours
          path: |
            dist/showcase/H3-Studio-Tour*.mp4
            dist/showcase/H3-Studio-Tour.en.srt
            dist/showcase/tour-verified.json
            dist/showcase/review-*.jpg
          if-no-files-found: error
          retention-days: 3
      - name: Retain tour media when verification fails
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tour-diagnostics
          path: dist/showcase/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-examples
          path: |
            dist/source-tests.xml
            dist/native-edit-room/
            dist/community/Studio-*/verification.json
            dist/community/Studio-*/home/desktop.log
            dist/workshops/Workshops-*/home/desktop.log
            dist/workshops/Workshops-*/verified.json
            dist/workshops/Workshops-*/tour-bounds.json
            dist/workshops/Workshops-*/Tidal-Relay.html
            dist/workshops/Workshops-*/*.jpg
            !dist/workshops/Workshops-*/failure.jpg
            dist/workshops/Workshops-*/record-*/*.jpg
            dist/workshops/Workshops-*/Narrated vertical.mp4
            dist/workshops/Workshops-*/Reframed vertical.mp4
            dist/workshops/Workshops-*/Ending narration.mp4
          retention-days: 3
